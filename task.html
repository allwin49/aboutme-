<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>
    <link rel="stylesheet" href="">

<style>

body {
    background-color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    height: 100vh;
    margin: 0;
}

.card {
    background-color: white;
    width: 300px;

    padding: 32px 20px;

    text-align: center;

    border-radius: 16px;

    box-shadow: 0 10px 25px black;
}

.profile {
    width: 96px;
    height: 96px;

    background-color: skyblue;
    color: white;

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 36px;

    margin: 0 auto 18px;
}

h2 {
    margin: 0;
    font-size: 20px;
}

.role {
    color:black ;
    margin-top: 6px;
}

.description {
    color:black;
    margin-top: 18px;
}

.skills {
    margin-top: 18px;
}

.skills span {
    background-color:white;
    color:blue;

    padding: 6px 12px;

    border-radius: 20px;

    font-size: 12px;

    margin: 3px;

    display: inline-block;
}

button {
    margin-top: 18px;

    background-color:skyblue;
    color: white;

    border: none;

    padding: 10px 25px;

    border-radius: 7px;

    cursor: pointer;
}

button:hover{
    background-color: darkblue;

}

 </style>
    


</head>

<body>

    <div class="card">

        <div class="profile"> 
            A        
        </div>

        <h2>Allwin Marshal J</h2>
        <hr>

        <p class="role">Python Full Stack Developer</p>

        <p class="description">
            I am a Python Full Stack Developer who enjoys building web 
            applications and learning new technologies.
        </p>

        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>JavaScript</span>
            <span>Python</span>
            <span>Django</span>
        </div>

        <button>Contact Me</button>

    </div>

</body>
</html>
